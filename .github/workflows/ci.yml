# Проверка каждого изменения: тесты на Windows, macOS и Linux, затем пробная сборка установщиков
# (их можно скачать со страницы запуска — раздел Artifacts, хранятся неделю).
name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['v*'] # теги собирает release.yml
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Линтер и оформление
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run lint
      - run: npm run format:check

  test:
    name: Тесты (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1' # тестам Electron не нужен
      - run: npm test

  build:
    name: Сборка
    needs: [lint, test]
    uses: ./.github/workflows/build.yml
    with:
      publish: false
